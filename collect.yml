name: Hourly Kalshi snapshot

on:
  schedule:
    - cron: "7 * * * *"        # every hour at :07 UTC (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also backfill this many days from Kalshi candlesticks (0 = none)"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kalshi-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Kalshi prices
        run: |
          DAYS="${{ github.event.inputs.backfill_days || '0' }}"
          if [ "$DAYS" != "0" ]; then
            python collector/kalshi_board.py --backfill "$DAYS"
          else
            python collector/kalshi_board.py
          fi

      - name: Save snapshot to repo
        run: |
          git config user.name  "futures-board-bot"
          git config user.email "futures-board-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M')Z" -q
            git pull --rebase -q || true
            git push -q
          fi

      - name: Package site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish dashboard
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Publish dashboard (retry)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
